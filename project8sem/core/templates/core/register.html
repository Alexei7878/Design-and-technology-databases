{% extends "core/base.html" %}
{% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-semibold">АСУ ТП</span>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}"">Войти</a>
            </div>
        </div>
    </nav>
{% endblock %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h4 class="text-center mb-3">Регистрация сотрудника</h4>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Имя</label>
                            <input class="form-control" name="first_name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Фамилия</label>
                            <input class="form-control" name="last_name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input class="form-control" name="username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Подтверждение пароля</label>
                        <input type="password" class="form-control" name="password_chek">
                    </div>

                    <hr class="my-4">

                    <div class="mb-3">
                        <label class="form-label">Должность</label>
                        <input class="form-control" name="position">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Подразделение</label>
                        <input class="form-control" name="department">
                    </div>

                    {% if errors %}
                        {% for field, error in errors.items %}
                            <p style="color: red;">{{ error }}</p>
                        {% endfor %}
                    {% endif %}

                    <button class="btn btn-success w-100">
                        Зарегистрировать
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
